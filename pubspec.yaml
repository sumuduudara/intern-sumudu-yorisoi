name: yorisoi
description: "Canonical Yorisoi Flutter application foundation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_svg: 2.3.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  firebase_ai: 5.1.0
  firebase_app_check: 0.5.1
  speech_to_text: 7.5.0
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  firebase_core_platform_interface: ^8.1.1

flutter:
  uses-material-design: true
  assets:
    - docs/story_generation_prompt.md
    - assets/images/home/
    - assets/images/auth/
    - assets/images/pets/
  fonts:
    - family: Zen Maru Gothic
      fonts:
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Medium.ttf
          weight: 500
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Bold.ttf
          weight: 700
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Black.ttf
          weight: 900
    - family: Yomogi
      fonts:
        - asset: assets/fonts/yomogi/Yomogi-Regular.ttf
